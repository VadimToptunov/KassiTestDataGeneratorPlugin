name: Release

# Publishes to the JetBrains Marketplace on a version tag (e.g. `v1.0.1`).
# NOTE: the FIRST version of a new plugin must be uploaded manually for moderation
# (see PUBLISHING.md). This workflow is for subsequent releases, once the plugin exists
# and the PUBLISH_TOKEN repository secret is set.
#
# Required secret:  PUBLISH_TOKEN   — JetBrains Marketplace personal access token.
# Optional secrets: CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD (plugin signing).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (without leading v, e.g. 1.0.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin
        run: ./gradlew buildPlugin -PpluginVersion=${{ steps.ver.outputs.version }} --stacktrace

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -PpluginVersion=${{ steps.ver.outputs.version }} --stacktrace

      - name: Attach distribution to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
